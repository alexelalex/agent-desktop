<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Agent Desktop</title>
    <script>
      // Set before first paint so dark mode doesn't flash light; src/lib/theme.ts takes over.
      try {
        const theme = localStorage.getItem('agent-desktop.theme')
        if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
